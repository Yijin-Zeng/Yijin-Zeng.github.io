<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POST_TITLE - Yijin Zeng</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap');

        :root {
            --text: #1a1a1a;
            --text-secondary: #666;
            --text-light: #999;
            --bg: #fafaf8;
            --border: #e8e8e4;
            --link: #2563eb;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            font-size: 15px;
        }

        a { color: var(--link); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .post {
            max-width: 1350px;
            margin: 0 auto;
            padding: 60px 24px 100px;
        }

        .post-back {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 40px;
            display: inline-block;
        }

        .post-back:hover { color: var(--text); }

        .post-header {
            margin-bottom: 40px;
        }

        .post-title {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            margin-bottom: 12px;
        }

        .post-meta {
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .post-meta .tag {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 500;
            padding: 2px 10px;
            border-radius: 4px;
            background: #eef2ff;
            color: #4338ca;
            margin-left: 12px;
        }

        .post-content h2 {
            font-size: 1.3rem;
            font-weight: 600;
            margin-top: 40px;
            margin-bottom: 16px;
        }

        .post-content h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 32px;
            margin-bottom: 12px;
        }

        .post-content p {
            margin-bottom: 16px;
            color: var(--text-secondary);
            line-height: 1.9;
        }

        .post-content ul, .post-content ol {
            margin-bottom: 16px;
            padding-left: 24px;
            color: var(--text-secondary);
        }

        .post-content li {
            margin-bottom: 8px;
            line-height: 1.8;
        }

        .post-content code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85em;
            background: #f0f0ec;
            padding: 2px 6px;
            border-radius: 3px;
        }

        .post-content pre {
            background: #1a1a1a;
            color: #e8e8ed;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            margin-bottom: 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .post-content pre code {
            background: none;
            padding: 0;
            color: inherit;
        }

        .post-content blockquote {
            border-left: 3px solid var(--link);
            padding-left: 16px;
            margin-bottom: 16px;
            color: var(--text-secondary);
            font-style: italic;
        }
    </style>
</head>
<body>

<article class="post">
    <a href="../index.html" class="post-back">&larr; Back to home</a>

    <header class="post-header">
        <h1 class="post-title">POST_TITLE</h1>
        <div class="post-meta">
            POST_DATE <span class="tag">POST_TOPIC</span>
        </div>
    </header>

    <div class="post-content">
        <!-- Write your content here using h2, h3, p, ul, ol, pre, code, blockquote -->
        <p>Your content goes here.</p>
    </div>
</article>

</body>
</html>
